
services:
  mongo:
    image: mongo:7
    container_name: smartcoop-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: smartcoop-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      MONGO_URI: ${MONGO_URI}
      DB_NAME: "smartcoop"
      MAX_UPLOAD_MB: "50"
      WORKERS: "4"
      APP_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  mongo_data:
